name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: one Python. The full multi-version sweep runs
        # locally before push; CI stays a fast, fully-blocking check.
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (integration skipped by marker)
        run: pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Rule 15: PEP 8 is enforced, not suggested — a style violation blocks
    # merging exactly like a failing test. Both the linter and the formatter
    # check must exit 0 for this job (and therefore the pipeline) to pass.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Pinned: an unpinned install let ruff 0.16 make Markdown code-fence
        # formatting the default, silently breaking format-check on doc examples.
        # Bump this deliberately, not by surprise.
        run: pip install "ruff==0.15.21"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format --check)
        run: ruff format --check .

  no-vendor-mentions:
    name: No disallowed AI-vendor mentions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history — the audit walks every commit message.
          fetch-depth: 0
      - name: Audit tracked files + history for disallowed AI-vendor names
        run: |
          # Flag Claude / Anthropic as WHOLE WORDS in tracked files or commit
          # messages — the point is to block Claude *attribution* (authorship,
          # Co-Authored-By trailers, contributor surfacing), NOT to erase the
          # legitimate product / skill-ecosystem names the docs must use.
          #
          # ALLOWED (standard product / ecosystem references, not attribution):
          #   - "Claude Desktop"  — the MCP-client product
          #   - "Claude Code"     — the CLI/agent product
          #   - "Claude Skill(s)" — the skill-ecosystem name this repo ships into
          #   - "skill Claude"    — the same name in French word order (LISEZMOI)
          #   - "claude mcp"      — the CLI call that registers the MCP server
          #   - "Claude / OpenCode" / "Claude + OpenCode" / "Claude and OpenCode"
          #                       — the two skill hosts named together
          #   - "~/.claude/skills/" and ".claude/…" — skill install paths
          # `-w` gives portable word boundaries (so neutral substrings like
          # "nomoreclaude" don't count) identically on macOS and Linux. This
          # workflow file, lockfiles and vector art are excluded from the scan.
          allow='claude[ -]?desktop|claude code|claude mcp|claude skills?|skills? claude|claude ?[/+]? ?(and )?opencode|\.claude/|\.claude\b'
          files="$(git grep -inwI -e claude -e anthropic -- ':!*.lock' ':!*.svg' ':!.github/workflows/ci.yml' | grep -viE "$allow" || true)"
          hist="$(git log --all --format='%H %s%n%b' | grep -iwE 'claude|anthropic' | grep -viE "$allow" || true)"
          if [ -n "$files" ] || [ -n "$hist" ]; then
            echo "::error::disallowed AI-vendor mention found (product/skill-ecosystem names are allowed; attribution is not)"
            printf '%s\n' "$files" "$hist"
            exit 1
          fi
          # Attribution phrasings are blocked unconditionally, with no allowlist
          # escape. "Claude Code" is a legitimate product name and is exempt
          # above — which is exactly why the standard "Generated with [Claude
          # Code](...)" trailer walked straight through the filter. The point of
          # this job is to keep attribution out; a product name appearing inside
          # an attribution trailer does not make it any less an attribution.
          attrib='co-authored-by:.*(claude|anthropic)|generated with .{0,4}claude|authored (by|with) .{0,4}claude'
          afiles="$(git grep -inIE "$attrib" -- ':!*.lock' ':!*.svg' ':!.github/workflows/ci.yml' || true)"
          ahist="$(git log --all --format='%H %s%n%b' | grep -iE "$attrib" || true)"
          if [ -n "$afiles" ] || [ -n "$ahist" ]; then
            echo "::error::Claude/Anthropic attribution found — never allowed, product name or not"
            printf '%s\n' "$afiles" "$ahist"
            exit 1
          fi
          echo "clean — no disallowed AI-vendor mentions, no attribution"

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. No member carries torch in its base
    # dependencies, so this is a cached-wheel install: well under a minute,
    # which is the point.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import sftp_helper"
