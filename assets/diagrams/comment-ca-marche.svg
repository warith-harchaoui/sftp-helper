<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1373 432" width="1373" height="432" role="img" aria-labelledby="sfh-title sfh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="sfh-title">Comment sftp-helper fonctionne : le client OpenSSH du système, emballé pour qu'un dossier ne coûte pas mille allers-retours</title>
  <desc id="sfh-desc">Une plaque de gauche à droite. Entrée : un fichier local ou un dossier entier, plus des identifiants. Le travail, en trois étapes numérotées : le chargeur d'identifiants les résout puis la clé d'hôte est vérifiée strictement, donc un hôte inconnu est un refus plutôt qu'une question que personne ne lit ; le transfert passe par le client OpenSSH du système, et un dossier est archivé, envoyé en un seul flux puis déployé à l'arrivée au lieu d'être parcouru fichier par fichier ; le résultat est ensuite contrôlé. Sortie : vos fichiers sur la machine distante.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="241" height="78" rx="10"/>
  <text class="n-title" x="148" y="120" text-anchor="middle">un fichier ou un dossier</text>
  <text class="n-sub" x="148" y="139" text-anchor="middle">plus vos identifiants</text>
  <path class="flow" d="M275 126 H291" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="295" y="54" width="792" height="144" rx="12"/>
  <text class="panel-label" x="315" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="315" y="94" width="276" height="78" rx="10"/>
  <text class="n-title" x="453" y="127" text-anchor="middle">vérifier la clé d'hôte</text>
  <text class="n-sub" x="453" y="146" text-anchor="middle">strict — hôte inconnu, c'est un refus</text>
  <text class="step" x="326" y="110">1</text>
  <path class="flow" d="M595 133 H611" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="617" y="94" width="246" height="78" rx="10"/>
  <text class="n-title" x="740" y="127" text-anchor="middle">transférer</text>
  <text class="n-sub" x="740" y="146" text-anchor="middle">OpenSSH ; dossier en une archive</text>
  <text class="step" x="628" y="110">2</text>
  <path class="flow" d="M867 133 H883" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="889" y="94" width="178" height="78" rx="10"/>
  <text class="n-title" x="978" y="127" text-anchor="middle">contrôler</text>
  <text class="n-sub" x="978" y="146" text-anchor="middle">liste, stat, existence</text>
  <text class="step" x="900" y="110">3</text>
  <path class="flow" d="M1093 126 H1109" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1113" y="40">SORTIE</text>
  <rect class="io" x="1113" y="87" width="232" height="78" rx="10"/>
  <text class="n-title" x="1229" y="120" text-anchor="middle">des fichiers à distance</text>
  <text class="n-sub" x="1229" y="139" text-anchor="middle">vérifiés, pas supposés</text>
  <rect class="core" x="477" y="232" width="420" height="54" rx="10"/>
  <text class="on-dark" x="687" y="253" text-anchor="middle">une bibliothèque, appelée pareil partout</text>
  <text class="on-dark-sub" x="687" y="272" text-anchor="middle">os-helper dessous pour la journalisation et les fichiers</text>
  <path class="tie" d="M687 286 V314 H423 V332"/>
  <path class="tie" d="M687 314 H951 V332"/>
  <path class="tie" d="M423 314 V332"/>
  <rect class="surface" x="348" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="423" y="360" text-anchor="middle">API Python</text>
  <path class="tie" d="M599 314 V332"/>
  <rect class="surface" x="524" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="599" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M775 314 V332"/>
  <rect class="surface" x="700" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="775" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M951 314 V332"/>
  <rect class="surface" x="876" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="951" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="687" y="412" text-anchor="middle">Un dossier voyage en un seul flux archivé plutôt qu'un aller-retour par fichier, qui est là où part le temps sur un lien lent.</text>
</svg>
