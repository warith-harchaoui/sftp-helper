<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1338 432" width="1338" height="432" role="img" aria-labelledby="sfh-title sfh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="sfh-title">How sftp-helper works: the system OpenSSH client, wrapped so a directory does not cost a thousand round-trips</title>
  <desc id="sfh-desc">A left-to-right plate. In: a local file or a whole directory, plus credentials. The work, in three numbered stages: the credentials loader resolves them and the host key is verified strictly, so an unknown host is a refusal rather than a prompt nobody reads; the transfer runs through the system OpenSSH client, and a directory is archived, sent as one stream and expanded on arrival instead of walking file by file; then the result is checked, listing, stat and exists. Out: your files on the remote. Underneath, the core object reached through the four surfaces every member exposes.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="215" height="78" rx="10"/>
  <text class="n-title" x="136" y="120" text-anchor="middle">a file or a directory</text>
  <text class="n-sub" x="136" y="139" text-anchor="middle">plus your credentials</text>
  <path class="flow" d="M249 126 H265" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="269" y="54" width="817" height="144" rx="12"/>
  <text class="panel-label" x="289" y="76">WHAT IT DOES</text>
  <rect class="stage" x="289" y="94" width="256" height="78" rx="10"/>
  <text class="n-title" x="417" y="127" text-anchor="middle">verify the host key</text>
  <text class="n-sub" x="417" y="146" text-anchor="middle">strict — unknown host is a refusal</text>
  <text class="step" x="300" y="110">1</text>
  <path class="flow" d="M549 133 H565" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="571" y="94" width="298" height="78" rx="10"/>
  <text class="n-title" x="721" y="127" text-anchor="middle">transfer</text>
  <text class="n-sub" x="721" y="146" text-anchor="middle">system OpenSSH; dirs sent as one archive</text>
  <text class="step" x="582" y="110">2</text>
  <path class="flow" d="M874 133 H890" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="896" y="94" width="170" height="78" rx="10"/>
  <text class="n-title" x="981" y="127" text-anchor="middle">check</text>
  <text class="n-sub" x="981" y="146" text-anchor="middle">list, stat, exists</text>
  <text class="step" x="907" y="110">3</text>
  <path class="flow" d="M1092 126 H1108" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1112" y="40">OUT</text>
  <rect class="io" x="1112" y="87" width="198" height="78" rx="10"/>
  <text class="n-title" x="1211" y="120" text-anchor="middle">files on the remote</text>
  <text class="n-sub" x="1211" y="139" text-anchor="middle">verified, not assumed</text>
  <rect class="core" x="453" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="669" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="669" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M669 286 V314 H405 V332"/>
  <path class="tie" d="M669 314 H933 V332"/>
  <path class="tie" d="M405 314 V332"/>
  <rect class="surface" x="330" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="405" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M581 314 V332"/>
  <rect class="surface" x="506" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="581" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M757 314 V332"/>
  <rect class="surface" x="682" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="757" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M933 314 V332"/>
  <rect class="surface" x="858" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="933" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="669" y="412" text-anchor="middle">A directory travels as a single archived stream rather than one round-trip per file, which is where the time goes on a slow link.</text>
</svg>
